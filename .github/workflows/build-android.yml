name: Build BikeBinder standalone Android release APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-android.yml'
      - 'app.json'
      - 'App.js'
      - 'index.js'
      - 'storage.js'
      - 'screens/**'
      - 'components/**'
      - 'hooks/**'
      - 'utils/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact project dependencies
        run: npm ci

      - name: Clean Expo Android prebuild
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone RELEASE APK with embedded Hermes JS
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Reject development-only APK and wrong version
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          if ! unzip -Z1 "$APK" | grep -Fxq 'assets/index.android.bundle'; then
            echo "::error::Missing assets/index.android.bundle; this APK would require Metro and cannot be installed as a standalone app"
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -n "$AAPT"
          PKG="$("$AAPT" dump badging "$APK" | grep "^package:")"
          echo "$PKG"
          echo "$PKG" | grep -F "name='com.bikebinder.app'"
          echo "$PKG" | grep -F "versionCode='6'"
          echo "$PKG" | grep -F "versionName='1.2.3'"
          echo 'Verified: standalone JavaScript bundle embedded'
          sha256sum "$APK"

      - name: Upload candidate APK for original-keystore signing
        uses: actions/upload-artifact@v4
        with:
          name: BikeBinder-v1.2.3-STANDALONE-CANDIDATE-REQUIRES-ORIGINAL-SIGNING
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
