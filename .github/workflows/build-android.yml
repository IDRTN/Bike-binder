name: Build BikeBinder standalone Android release APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-android.yml'
      - 'app.json'
      - 'App.js'
      - 'index.js'
      - 'storage.js'
      - 'screens/**'
      - 'components/**'
      - 'hooks/**'
      - 'utils/**'
      - 'package*.json'
  workflow_dispatch:

# Only the latest BikeBinder Android build is actionable.
concurrency:
  group: bikebinder-standalone-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact project dependencies
        run: npm ci

      - name: Clean Expo Android prebuild
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Configure Gradle for memory-constrained GitHub runners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/gradle.properties")
          assert path.is_file(), "Expo prebuild did not create android/gradle.properties"
          changes = {
              "org.gradle.jvmargs": "-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8",
              "org.gradle.parallel": "false",
              "org.gradle.workers.max": "2",
              "kotlin.compiler.execution.strategy": "in-process",
              "kotlin.incremental": "false",
              "reactNativeArchitectures": "armeabi-v7a,arm64-v8a",
          }
          old = path.read_text().splitlines()
          preserved = [line for line in old if line.strip().split("=", 1)[0].strip() not in changes]
          path.write_text("\n".join(preserved + [""] + [f"{key}={value}" for key, value in changes.items()]) + "\n")
          for key, value in changes.items():
              print(f"Gradle setting: {key}={value}")
          PY

      - name: Build standalone RELEASE APK with embedded Hermes JS
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=2 --console=plain --stacktrace

      - name: Reject development-only APK and wrong version
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          if ! unzip -Z1 "$APK" | grep -Fxq 'assets/index.android.bundle'; then
            echo "::error::Missing assets/index.android.bundle; this APK would require Metro and cannot be installed as a standalone app"
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -n "$AAPT"
          PKG="$("$AAPT" dump badging "$APK" | grep "^package:")"
          echo "$PKG"
          echo "$PKG" | grep -F "name='com.bikebinder.app'"
          echo "$PKG" | grep -F "versionCode='6'"
          echo "$PKG" | grep -F "versionName='1.2.3'"
          echo 'Verified: standalone JavaScript bundle embedded'
          sha256sum "$APK"

      - name: Require original Android signing credentials in GitHub Actions secrets
        env:
          KEYSTORE_B64: ${{ secrets.BIKEBINDER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.BIKEBINDER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BIKEBINDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BIKEBINDER_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Original BikeBinder signing secrets are not configured. Add BIKEBINDER_KEYSTORE_B64, BIKEBINDER_KEYSTORE_PASSWORD, BIKEBINDER_KEY_ALIAS, BIKEBINDER_KEY_PASSWORD in Settings > Secrets and variables > Actions. Do not install an unsigned or debug-key APK over the current app."
            exit 1
          fi

      - name: Sign standalone APK with original installation key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BIKEBINDER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.BIKEBINDER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BIKEBINDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BIKEBINDER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/bikebinder-sign" dist
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bikebinder-sign/original.jks"
          unset KEYSTORE_B64
          KEYSTORE="$RUNNER_TEMP/bikebinder-sign/original.jks"
          test -s "$KEYSTORE"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$ZIPALIGN" && test -x "$SIGNER"
          "$ZIPALIGN" -f -p 4 android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/bikebinder-sign/aligned.apk"
          "$SIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out dist/BikeBinder-v1.2.3-GPS-STANDALONE.apk "$RUNNER_TEMP/bikebinder-sign/aligned.apk"
          "$SIGNER" verify --verbose --print-certs dist/BikeBinder-v1.2.3-GPS-STANDALONE.apk
          CERT="$("$SIGNER" verify --print-certs dist/BikeBinder-v1.2.3-GPS-STANDALONE.apk | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$CERT" = "dd8c279ec28b342520ae868c7fe0d3fd4731e49f0fb2ebc4bb21dddbeec47fbd"
          if ! unzip -Z1 dist/BikeBinder-v1.2.3-GPS-STANDALONE.apk | grep -Fxq 'assets/index.android.bundle'; then
            echo "::error::Signed APK missing bundled JavaScript"
            exit 1
          fi
          "$ZIPALIGN" -c -p 4 dist/BikeBinder-v1.2.3-GPS-STANDALONE.apk
          sha256sum dist/BikeBinder-v1.2.3-GPS-STANDALONE.apk
          rm -rf "$RUNNER_TEMP/bikebinder-sign"

      - name: Upload INSTALL-READY signed APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BikeBinder-v1.2.3-GPS-FIX-INSTALL-READY
          path: dist/BikeBinder-v1.2.3-GPS-STANDALONE.apk
          if-no-files-found: error
          retention-days: 90
