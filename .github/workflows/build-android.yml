name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout original BikeBinder branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME"

      - name: Prebuild native project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build Android APK with original build configuration
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify package, version, and published original signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$NEW_APK"
          mkdir -p prior
          gh release download v1.2.0 --repo IDRTN/Bike-binder --pattern 'app-debug.apk' --dir prior --clobber
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$SIGNER"
          test -n "$AAPT"
          "$SIGNER" verify "$NEW_APK"
          "$SIGNER" verify prior/app-debug.apk
          NEW_CERT="$("$SIGNER" verify --print-certs "$NEW_APK" | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}')"
          OLD_CERT="$("$SIGNER" verify --print-certs prior/app-debug.apk | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}')"
          test -n "$NEW_CERT"
          echo "New certificate SHA-256: $NEW_CERT"
          echo "Original published certificate SHA-256: $OLD_CERT"
          if [ "$NEW_CERT" != "$OLD_CERT" ]; then
            echo "::error::New signing certificate differs from published BikeBinder 1.2.0; aborting release."
            exit 1
          fi
          PACKAGE_INFO="$("$AAPT" dump badging "$NEW_APK" | grep '^package:')"
          echo "$PACKAGE_INFO"
          echo "$PACKAGE_INFO" | grep "name='com.bikebinder.app'"
          echo "$PACKAGE_INFO" | grep "versionCode='5'"
          echo "$PACKAGE_INFO" | grep "versionName='1.2.2'"
          echo "Verified published BikeBinder signing key, package, and version."

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: BikeBinder v1.2.2 — GPS update
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            GPS tracking bug fix on the original BikeBinder master branch.
            Original Android app ID: com.bikebinder.app.
            Version code: 5.
            APK signing certificate verified against the GitHub v1.2.0 release.

            Important: This does not prove that the signing certificate matches
            an existing installation obtained from another source. If Android
            says App not installed, DO NOT uninstall or clear data. Existing
            motorcycle and maintenance records could be lost.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
