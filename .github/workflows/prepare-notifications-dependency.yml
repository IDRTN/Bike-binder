name: Prepare BikeBinder Notifications Dependency

on:
  push:
    branches: [feature/insurance-renewal-reminders-20261115]
    paths: ['.github/workflows/prepare-notifications-dependency.yml']

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add Expo SDK 56 compatible notifications module and update lockfile
        run: npm install --save-exact expo-notifications@56.0.26 --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package lock is consistent
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit dependency and lockfile to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile already current"
          else
            git commit -m "Install Expo SDK 56 local notifications for motorcycle insurance renewal reminders"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
