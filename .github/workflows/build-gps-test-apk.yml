name: Build BikeBinder GPS Update APK

on:
  push:
    branches:
      - fix/background-ride-mileage-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout GPS fix branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify existing app package
        run: |
          test "$(node -p "require('./app.json').expo.android.package")" = "com.bikebinder.app"
          test "$(node -p "require('./app.json').expo.android.versionCode")" = "4"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu Android runner already provides a current Android SDK.
      # android-actions/setup-android@v3 now fails while requesting a retired 'tools' SDK package.
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build upgrade APK with the existing app ID
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Compare signing certificate with published BikeBinder APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$NEW_APK"
          mkdir -p prior-build
          gh release download v1.2.0 --repo IDRTN/Bike-binder --pattern "app-debug.apk" --dir prior-build --clobber
          OLD_APK="prior-build/app-debug.apk"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$SIGNER"
          "$SIGNER" verify "$NEW_APK"
          "$SIGNER" verify "$OLD_APK"
          NEW_CERT="$("$SIGNER" verify --print-certs "$NEW_APK" | grep -m1 "certificate SHA-256 digest:" | awk '{print $NF}')"
          OLD_CERT="$("$SIGNER" verify --print-certs "$OLD_APK" | grep -m1 "certificate SHA-256 digest:" | awk '{print $NF}')"
          echo "New APK signing cert SHA256: $NEW_CERT"
          echo "Published APK signing cert SHA256: $OLD_CERT"
          if [ -z "$NEW_CERT" ] || [ "$NEW_CERT" != "$OLD_CERT" ]; then
            echo "::error::Signing keys differ. Do not replace the installed BikeBinder. The original signing key is required."
            exit 1
          fi
          echo "Signing certificate matches published BikeBinder version 1.2.0"
          ls -lh "$NEW_APK"

      - name: Upload BikeBinder upgrade APK
        uses: actions/upload-artifact@v4
        with:
          name: BikeBinder-1.2.1-GPS-Update-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
