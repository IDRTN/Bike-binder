name: Build BikeBinder GPS Test APK

on:
  push:
    branches:
      - fix/background-ride-mileage-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout GPS fix branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu Android runner already provides a current Android SDK.
      # android-actions/setup-android@v3 now fails while requesting a retired 'tools' SDK package.
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build Android debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK (test only)
        uses: actions/upload-artifact@v4
        with:
          name: BikeBinder-GPS-test-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
