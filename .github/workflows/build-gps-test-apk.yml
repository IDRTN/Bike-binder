name: Build BikeBinder GPS Test APK

on:
  push:
    branches:
      - fix/background-ride-mileage-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout GPS fix branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure separate, self-contained GPS test app
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          config.expo.name = 'BikeBinder GPS Test';
          config.expo.android.package = 'com.bikebinder.gpstest';
          // Do not fetch production over-the-air updates into an isolated test APK.
          config.expo.updates = { ...config.expo.updates, enabled: false };
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          console.log('Preparing standalone GPS test:', config.expo.android.package);
          NODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu Android runner already provides a current Android SDK.
      # android-actions/setup-android@v3 now fails while requesting a retired 'tools' SDK package.
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build standalone Android release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify bundled JS and APK signature
        run: |
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          unzip -l "$APK" | grep 'assets/index.android.bundle'
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$SIGNER"
          "$SIGNER" verify "$APK"
          ls -lh "$APK"

      - name: Upload installable APK (test only)
        uses: actions/upload-artifact@v4
        with:
          name: BikeBinder-GPS-Standalone-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
