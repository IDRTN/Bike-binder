# One-time publication of the original-install-key signed GPS fix.
# Uses the public v1.2.2 release APK and a verified 4 KiB replacement
# APK v2 signing block (public signature only; NO keystore or passwords).
# Does not compile or modify app logic or motorcycle data.
name: Publish BikeBinder v1.2.2 original-signature GPS APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-bikebinder-original-signed-gps-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download existing published v1.2.2 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bikebinder
          gh release download v1.2.2 --repo "$GITHUB_REPOSITORY" --pattern 'app-debug.apk' --dir /tmp/bikebinder

      - name: Apply and verify original-key signing correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, zipfile
          source = Path('/tmp/bikebinder/app-debug.apk')
          dest = Path('/tmp/bikebinder/BikeBinder-v1.2.2-GPS-FIX-ORIGINAL-SIGNATURE.apk')
          data = source.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '04e986af20d146e26c7412ac897f9ac808584117d52adc5679995dc5c04de16a', 'Unexpected source release APK; refusing to patch'
          block = gzip.decompress(base64.b64decode(''))
          start = 186407090
          assert len(block) == 4096 and data[start+4080:start+4096] == b'APK Sig Block 42', 'Unexpected APK signing block'
          updated = data[:start] + block + data[start+4096:]
          assert hashlib.sha256(updated).hexdigest() == 'd43173f113104ddbfd77c90ae66fae1ccec62f6cf2a7f3e64848c8ab80662a6e', 'Signed APK checksum mismatch'
          dest.write_bytes(updated)
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None, 'ZIP integrity check failed'
          print('Corrected APK verified:', dest, 'bytes:', len(updated))

          PY

      - name: Publish downloadable corrected APK to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.2.2 /tmp/bikebinder/BikeBinder-v1.2.2-GPS-FIX-ORIGINAL-SIGNATURE.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v1.2.2 --repo "$GITHUB_REPOSITORY" --latest
